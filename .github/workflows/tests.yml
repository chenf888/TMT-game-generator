name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Smoke suite (fixtures, scaffold e2e, type layer)
        run: node tests/run_tests.js

      - name: Package conformance (name == directory, size limits)
        run: node scripts/pack.js --out "$RUNNER_TEMP/dist"
